.seg{border:0;background:var(--fill);border-radius:10px;padding:2px;gap:0}
.seg button{border-radius:8px;min-height:32px;color:var(--fg);font-weight:500;background:transparent}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
/* switches instead of checkboxes */
label.check{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-direction:row-reverse}
label.check input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:51px;height:31px;border-radius:31px;background:var(--fill);position:relative;cursor:pointer;transition:background .2s;margin:0}
label.check input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
label.check input[type=checkbox]:checked{background:var(--green)}
label.check input[type=checkbox]:checked::after{transform:translateX(20px)}
label.check span{flex:1}
/* sliders */
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--fill)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 3px 8px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.06)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--fill)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18)}
/* disclosure rows with a chevron */
details.box>summary{font-weight:600;font-size:17px}
details.box>summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);margin-top:-4px;transition:transform .2s}
details.box[open]>summary::after{content:"";transform:rotate(225deg);margin-top:4px}
details.sub{border:0;background:var(--bg);border-radius:12px}
/* ranking as an inset grouped list */
.list{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;padding:0}
.row{padding-inline:14px;border:0!important;border-radius:0!important;background:transparent;border-bottom:.5px solid var(--line)!important;min-height:58px}
.row:last-child{border-bottom:0!important}
.row:hover{background:var(--fill);opacity:1}
.row.sel{background:var(--tint);box-shadow:none}
/* map: Apple Maps–style controls; solid (no blur) so panning stays fast */
.mapbox{border:0;border-radius:18px;box-shadow:var(--shadow)}
.zoombtns{gap:0;background:var(--panel);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.16);overflow:hidden}
.zoombtns button{background:transparent;border-radius:0;color:var(--fg);min-height:40px;height:40px;width:40px}
.zoombtns button+button{border-top:.5px solid var(--line)}
.maphint{border:0;border-radius:9px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:12.5px}
.pcard{border:0;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.tip{border:0;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.16)}
.opt{border:0;background:var(--panel);box-shadow:var(--shadow)}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.prio span{background:var(--fill)}
.live{border:0;background:var(--bg)}
.gtoast{border-radius:14px}
.anim{border:0;background:var(--bg)}
th,.biastable th,.calc th,.row .n,.row .ad,.range output,.prio b{font-family:var(--body)!important;font-variant-numeric:tabular-nums}
th{text-transform:none!important;letter-spacing:0!important;font-weight:600}
details.sub>summary,.gdet>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.sub>summary::-webkit-details-marker,.gdet>summary::-webkit-details-marker{display:none}
details.sub>summary::after,.gdet>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;flex:none;margin-right:4px}
details.sub[open]>summary::after,.gdet[open]>summary::after{transform:rotate(45deg)}
.gdet>summary{justify-content:flex-start}
@media (max-width:600px){.zoombtns button{width:36px;height:36px;min-height:36px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="brand" data-t="brand"></span>
    <div class="seg" role="group" aria-label="Language"><button id="lEn" aria-pressed="true">EN</button><button id="lEs" aria-pressed="false">ES</button></div>
  </div>

  <section class="panel hero" id="start">
    <span class="eyebrow" data-t="eyebrow"></span>
    <h1 data-t="h1"></h1>
    <p class="lede" data-th="intro1"></p>
    <p class="lede" data-th="intro2"></p>
    <div style="display:flex;flex-direction:column;gap:6px"><span class="lab" data-t="prioTitle"></span><div class="prio" id="prio"></div></div>
    <div class="cta"><button class="primary" id="startQuiz" data-t="startQuiz"></button><button class="ghost" id="fullQuiz" data-t="fullQuiz"></button><button id="skipQuiz" data-t="skipQuiz"></button><button class="ghost" id="resumeTake" hidden data-t="resume"></button></div>
    <p class="meta" data-t="startNote"></p>
    <details class="box choices"><summary><span data-t="choicesTitle"></span></summary><div class="inner" data-th="choicesBody"></div></details>
  </section>

  <section class="panel" id="quizPanel" hidden aria-live="polite">
    <div class="qwrap" id="qwrap"></div>
  </section>

  <section class="panel" id="vsPanel" hidden>
    <div class="dhead">
      <div style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow" data-t="vsEyebrow"></span><h2 data-t="vsTitle"></h2></div>
      <div class="match"><span class="big" id="matchPct">0%</span><span class="meta" data-t="matchLabel"></span></div>
    </div>
    <div class="vs" id="vsLists"></div>
    <div class="diffs" id="vsDiffs"></div>
    <div id="vsDefaults"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="toggles"><button class="primary" id="shareTake" data-t="share"></button><button id="retake" data-t="retake"></button><button class="ghost" id="toMap" data-t="toMap"></button></div>
  </section>

  <section class="modebar" id="modeBar">
    <div class="seg" role="group" aria-label="Whose take"><button id="mEqual" aria-pressed="false" data-t="eqTake"></button><button id="mAdriano" aria-pressed="true" data-t="adTake"></button><button id="mYours" aria-pressed="false" data-t="yourTake"></button></div>
    <p class="meta" id="modeNote"></p>
  </section>

  <section style="display:flex;flex-direction:column;gap:12px" id="mapSec">
    <div class="rankhead">
      <div style="display:flex;flex-direction:column;gap:4px"><h2 data-t="mapTitle"></h2></div>
      <button class="chipbtn" id="tDots" aria-pressed="false" data-t="dotsOnly"></button>
    </div>
    <details class="box" id="mapOpts">
      <summary><span data-t="optsTitle"></span><span class="meta" id="fsum" style="font-weight:400;margin-left:auto"></span></summary>
      <div class="inner">
        <div class="mapctl">
          <div class="field"><label class="lab" for="colorBy" data-t="colorBy"></label><select id="colorBy"></select></div>
          <div class="field"><label class="lab" for="styleSel" data-t="mapStyle"></label><select id="styleSel"></select></div>
          <div class="field"><label class="lab" for="projSel" data-t="projection"></label><select id="projSel"></select></div>
          <div class="field"><label class="lab" for="search" data-t="find"></label><input id="search" type="search" list="names" autocomplete="off"><datalist id="names"></datalist></div>
        </div>
        <div class="field"><span class="lab" data-t="layers"></span><div class="toggles"><button class="chipbtn" id="tCountries" aria-pressed="true" data-t="countries"></button><button class="chipbtn" id="tCities" aria-pressed="true" data-t="cities"></button><button class="chipbtn" id="tLabels" aria-pressed="true" data-t="cityNames"></button><button class="chipbtn" id="tOpac" aria-pressed="false" data-t="shadeOpac"></button></div><p class="meta" data-t="dotsNote"></p></div>

        <div class="field"><span class="lab" data-t="mustHave"></span><div class="mustgrid" id="mustMenu"></div></div>
        <div><button id="freset" data-t="resetFilters"></button></div>
      </div>
    </details>
    <div class="toggles" id="regions" role="group" aria-label="Map view"></div>
    <div class="mapbox" id="mapbox">
      <canvas id="map" role="img" aria-label="World map"></canvas>

      <span class="maphint" id="maphint"></span>

      <div class="tip" id="tip"></div>
      <div class="pcard" id="pcard" hidden></div>
    </div>
    <p class="meta" data-t="namesRule"></p>
    <div class="legend" id="legend"></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:12px" id="rankSec">

    <div class="list" id="list"></div>
    <div><button id="more" data-t="showAll"></button></div>
  </section>

  <div class="grid2 after" id="detailSec">
    <section class="panel" id="detail" aria-live="polite"></section>

      <div style="display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap"><h2 data-t="compare"></h2><button id="cmpClear" data-t="clear"></button></div>
      <div class="cmp"><div class="cmpgrid" id="cmp"></div></div>
    </section>
  </div>

  <section class="panel after" id="offerPanel">

    <div id="offerRows" style="display:flex;flex-direction:column;gap:8px"></div>
    <div id="offerOut"></div>
  </section>

  <details class="box after" id="weightsBox">
    <summary><span data-t="weightsTitle"></span></summary>
    <div class="inner wgrid">
      <div class="wmain">
      <p class="meta" data-t="weightsNote"></p>
      <div class="toggles"><div class="field"><label class="lab" for="preset" data-t="preset"></label><select id="preset"></select></div><button id="undoBtn" data-t="undo" disabled></button></div>

      <label class="check"><input type="checkbox" id="reach"><span data-t="reachLabel"></span></label>
      </div></details>
      <details class="sub"><summary data-t="secStats"></summary><div class="subin">

        <div class="field"><label class="lab" for="happyM" data-t="happyLab"></label><select id="happyM"></select></div>
      </div>
      <p class="meta" data-t="rankByNote"></p>
      </div></details>
      <div id="effw"></div>
      </div>
      <aside class="live" id="liveTop" aria-live="polite"></aside>
    </div>
  </details>

  <details class="box after">
    <summary><span data-t="howTitle"></span></summary>
    <div class="inner foot" id="howInner"></div>
  </details>
</div>

 ['Safety',`${A('hom','UNODC homicide rates')} (country) or ${A('fbi','FBI 2024 rates')} (US cities), averaged with the ${A('nqol','Numbeo Safety Index')}`],
 ['Freedom',`${A('eiu','EIU Democracy Index 2023')} averaged with ${A('fh','Freedom House 2026')} where its score is published`],
 ['Money left after rent',`Average monthly net salary minus a one-bedroom rent in the centre, divided by local prices (${A('ncol','Numbeo cost of living')}, New York = 100%), so every city is in New York dollars. ${A('items','Numbeo item prices, April 2026 snapshot')} for 45 cities; elsewhere rebuilt from Numbeo’s salary, rent and price indices, calibrated on those 45 cities (the indices alone run about a third higher). Countries use the average of their cities, or ${A('ncolc','Numbeo purchasing power')} where none has rent data. This replaces purchasing power, cost of living and the rent half of housing, which counted rent twice.`],
 ['Climate (mild)',`The hottest and coldest months’ mean temperatures (${A('temps','1991–2020 normals')}), counted twice, averaged with the ${A('nqol','Numbeo Climate Index')}, which also reflects humidity. Hot summers lose most: a hottest-month mean above 28.5 °C (Dallas, Tampico) scores lowest. Cities without their own normals use the nearest station that has them, and the page names it. Warm and cool preferences use the annual mean temperature.`],
 ['Short commutes',`${A('nqol','Numbeo Traffic Commute Time Index')}`],
 ['Apartments available to rent',`How easy it is to find a place: official rental vacancy where published (${A('censusmsa','Census by metro')}, ${A('nychvs','NYC survey')}, ${A('cmhc','CMHC for Canada')}), otherwise how hard expats say it is to find housing (InterNations ${A('eic','city')} and country surveys). Availability data is patchy outside the US; where a city has none, its country’s figure is used and marked as national. What rent costs is in money left after rent.`],
 ['Job market',`The size of the metro economy (${A('gdp','GDP by metro area')}, counted once, since metro size also drives things happening), national ${A('iloy','unemployment for ages 15–24')} and the ${A('inf','share of informal jobs')}. It measures the general market, not your field. Field-specific numbers are hand estimates, off by default.`],
 ['US politics (optional)',`How the state and the county voted in the 2024 presidential election (${A('pres24','states')}, ${A('county','counties')}), averaged: the state sets most laws, the county is daily life. Scored in the direction you choose in the quiz, or left out. US cities only. It describes how neighbors voted, not how any one person will be treated.`],
 ['Things happening','Metro population, as a stand-in: there is no global count of concerts, venues or events, but bigger metros reliably have more. Cities only.'],
 ['Welcoming to newcomers',`InterNations Expat Insider ranks for ease of settling in and finding friends (${A('ei','2025 countries')}, ${A('eisp','2024 cities')}). The ${A('mai','Gallup Migrant Acceptance Index')} is used only where no Expat Insider rank exists.`],
 ['Life satisfaction',`${A('whr','World Happiness Report 2026')}, all 147 ranked countries. It already partly reflects income, health and freedom, so a second version is offered in the weights panel: what is left after those three (life satisfaction regressed on healthcare, freedom and GDP per person, keeping the remainder).`],
 ['Women’s safety and rights',`${A('wps','Women, Peace and Security Index 2025/26')}`],
 ['LGBTQ+ acceptance',`${A('eq','Equaldex Equality Index')} (167 countries)`],
 ['Work permit, language',`Two parts, shown separately on each place: the legal right to work (citizenship or free movement), and the route for a junior hire without it. Rules checked 11 November 2026: the ${A('hpi','UK High Potential Individual list')} (Columbia is on the 2026 list, for degrees awarded 1 Nov 2026 to 31 Oct 2027); ${A('bluecard','EU Blue Card salary thresholds')} (Netherlands 2026: €4,754 a month for recent graduates); ${A('ibero','Spain’s two-year residence route to citizenship for Ibero-American nationals, including Mexicans')} (Civil Code art. 22); ${A('tn','USMCA TN professional visas')} for Mexican citizens (US job offer and, for most listed professions, a bachelor’s degree). US citizens abroad still file ${A('irs','US taxes')}. Languages: official languages.`],
 ['Winter daylight, trip home','Calculated from latitude and distance. Type your real trip time on any place to replace the estimate.'],
 ['Low car dependence',`${A('ntr','Numbeo Traffic CO2 Emission Index')}, which reflects how much people commute by car versus transit, bike or foot. One measure everywhere: Walk Score and Transit Score exist only for US and Canadian cities, so they are shown on the city page but not scored. No global source for transit frequency or jobs reachable by transit was found.`],
 ['Tech job market (when your field is tech or software)',`The general job market averaged with the city’s rank in the ${A('sblink','StartupBlink Global Startup Ecosystem Index 2025')}, which ranks 1,000 cities on startups, scale-ups, investment and tech business activity. Top 10 = 5, 11–30 = 4, 31–75 = 3, 76–200 = 2, lower or unranked = 1. A country uses its best-ranked city. It measures the tech ecosystem, not job postings, so treat it as a strong signal, not a count of openings.`],
 ['Jobs in other specific fields','No published global data for finance, healthcare, creative work or research. Those fields use the general job market; hand estimates are available but off unless you turn them on.']],
es:[['Acceso a la salud',`${A('uhc','Índice de Cobertura de Servicios de la OMS 2023')} (país) promediado con el ${A('nqol','Índice de Atención Médica de Numbeo 2026')} (ciudad). El índice de la OMS mide qué servicios existen, no quién está cubierto, así que donde mucha gente no tiene cobertura también se promedia: EE. UU. (7.9% sin seguro todo el año, Censo 2025) y México (39.1% sin acceso a servicios de salud, CONEVAL 2022).`],
 ['Seguridad',`${A('hom','Tasas de homicidio de la UNODC')} (país) o ${A('fbi','tasas del FBI 2024')} (ciudades de EE. UU.), promediadas con el ${A('nqol','Índice de Seguridad de Numbeo')}`],
 ['Libertad',`${A('eiu','Índice de Democracia de la EIU 2023')} promediado con ${A('fh','Freedom House 2026')} donde se publica su puntaje`],
 ['Dinero después de la renta',`Sueldo neto mensual promedio menos la renta de un departamento de una recámara en el centro, dividido entre los precios locales (${A('ncol','costo de vida de Numbeo')}, Nueva York = 100%), así que todas las ciudades quedan en dólares de Nueva York. ${A('items','Precios por artículo de Numbeo, corte de abril de 2026')} para 45 ciudades; en las demás se reconstruye con los índices de sueldo, renta y precios de Numbeo, calibrados con esas 45 ciudades (los índices solos dan cifras como un tercio más altas). Los países usan el promedio de sus ciudades, o el ${A('ncolc','poder adquisitivo de Numbeo')} si ninguna tiene datos de renta. Esto reemplaza al poder adquisitivo, el costo de vida y la mitad de renta de la vivienda, que contaban la renta dos veces.`],
 ['Clima (templado)',`La temperatura media del mes más cálido y del más frío (${A('temps','normales 1991–2020')}), con doble peso, promediada con el ${A('nqol','Índice de Clima de Numbeo')}, que también refleja la humedad. Los veranos calurosos pierden más: un mes más cálido con media de más de 28.5 °C (Dallas, Tampico) obtiene lo más bajo. Las ciudades sin normales propias usan la estación cercana que las tiene, y la página la nombra. Las preferencias de calor o frío usan la temperatura media anual.`],
 ['Trayectos cortos',`${A('nqol','Índice de Tiempo de Traslado de Numbeo')}`],
 ['Departamentos disponibles para rentar',`Qué tan fácil es encontrar dónde vivir: vacantes oficiales de renta donde se publican (${A('censusmsa','Censo por área metropolitana')}, ${A('nychvs','encuesta de NYC')}, ${A('cmhc','CMHC para Canadá')}), si no, qué tan difícil dicen los expatriados que es encontrar vivienda (encuestas de InterNations por ${A('eic','ciudad')} y país). Fuera de EE. UU. los datos son incompletos; si una ciudad no tiene, se usa la cifra de su país y se marca como nacional. Lo que cuesta la renta está en dinero después de la renta.`],
 ['Mercado laboral',`El tamaño de la economía metropolitana (${A('gdp','PIB por área metropolitana')}, cuenta una vez, porque el tamaño también define que pasen cosas), el ${A('iloy','desempleo nacional de 15 a 24 años')} y la ${A('inf','proporción de empleo informal')}. Mide el mercado en general, no tu campo. Las cifras por campo son estimaciones a mano, apagadas por defecto.`],
 ['Política en EE. UU. (opcional)',`Cómo votaron el estado y el condado en la elección presidencial de 2024 (${A('pres24','estados')}, ${A('county','condados')}), promediados: el estado define la mayoría de las leyes, el condado es la vida diaria. Se califica en la dirección que elijas en el cuestionario, o queda fuera. Solo ciudades de EE. UU. Describe cómo votaron los vecinos, no cómo te van a tratar.`],
 ['Que pasen cosas','Población metropolitana, como aproximación: no existe un conteo global de conciertos, recintos o eventos, pero las áreas más grandes tienen más. Solo ciudades.'],
 ['Acogedor con recién llegados',`Lugares de InterNations Expat Insider en facilidad para adaptarse y hacer amigos (${A('ei','países 2025')}, ${A('eisp','ciudades 2024')}). El ${A('mai','Índice de Aceptación de Migrantes de Gallup')} solo se usa donde no hay lugar de Expat Insider.`],
 ['Satisfacción con la vida',`${A('whr','Informe Mundial de la Felicidad 2026')}, los 147 países del ranking. Ya refleja en parte el ingreso, la salud y la libertad, así que en el panel de pesos hay una segunda versión: lo que queda después de esos tres (la satisfacción se ajusta por salud, libertad y PIB por persona, y se conserva el resto).`],
 ['Seguridad y derechos de las mujeres',`${A('wps','Índice de Mujeres, Paz y Seguridad 2025/26')}`],
 ['Aceptación LGBTQ+',`${A('eq','Índice de Igualdad de Equaldex')} (167 países)`],
 ['Permiso de trabajo, idioma',`Dos partes, que se muestran por separado en cada lugar: el derecho legal a trabajar (ciudadanía o libre circulación) y la vía para alguien recién egresado sin ese derecho. Reglas revisadas el 11 de noviembre de 2026: la ${A('hpi','lista High Potential Individual del Reino Unido')} (Columbia está en la lista 2026, para títulos del 1 de nov. de 2026 al 31 de oct. de 2027); los ${A('bluecard','umbrales de sueldo de la Tarjeta Azul de la UE')} (Países Bajos 2026: €4,754 al mes para recién egresados); la ${A('ibero','vía de dos años de residencia a la nacionalidad española para iberoamericanos, incluidos los mexicanos')} (art. 22 del Código Civil); las ${A('tn','visas TN del T-MEC')} para ciudadanos mexicanos (oferta de trabajo en EE. UU. y, en la mayoría de las profesiones, licenciatura). Los ciudadanos estadounidenses en el extranjero siguen declarando ${A('irs','impuestos en EE. UU.')}. Idiomas: idiomas oficiales.`],
 ['Luz en invierno, viaje a casa','Calculados con la latitud y la distancia. Escribe tu tiempo real de viaje en cualquier lugar para reemplazar la estimación.'],
 ['Poca dependencia del auto',`${A('ntr','Índice de CO2 de tráfico de Numbeo')}, que refleja cuánto se viaja en auto frente a transporte público, bici o a pie. Una sola medida en todos lados: Walk Score y Transit Score solo existen en EE. UU. y Canadá, así que se muestran en la página de la ciudad pero no cuentan. No se encontró una fuente global de frecuencia del transporte ni de empleos alcanzables en transporte público.`],
 ['Mercado laboral tech (si tu campo es tecnología o software)',`El mercado laboral general promediado con el lugar de la ciudad en el ${A('sblink','Índice Global de Ecosistemas de Startups de StartupBlink 2025')}, que clasifica 1,000 ciudades por startups, empresas en crecimiento, inversión y actividad tech. Top 10 = 5, 11–30 = 4, 31–75 = 3, 76–200 = 2, más abajo o sin lugar = 1. Un país usa su ciudad mejor clasificada. Mide el ecosistema tech, no vacantes publicadas, así que tómalo como una señal fuerte, no como un conteo de empleos.`],

const HOW={
en:`<p>Each place gets 1 to 5 on nineteen factors. Published data, official rules and calculations come first. Where published data is missing, the value is filled in by a tested statistical model and marked "filled in" with its measured error (see the last section). Hand-made estimates are shown greyed out and left out of the score unless you turn them on. Where two reputable sources exist, their scores are averaged so no single survey decides a factor. With scale balancing on, every factor is rescaled to the same average and spread before weighting. Verdicts: Strong fit at 70 and up, Workable at 60, Caution at 48, Avoid below that, plus the dealbreaker rules. A place can only be a Strong fit if housing, the job market, healthcare, safety, freedom and purchasing power all have published figures there, and filled-in values make up less than a fifth of its score. Otherwise it is held at Workable, however high it scores. Within each verdict, places are ordered by the low end of their likely range, so a place with many filled-in values doesn’t outrank an equally scored place that is fully measured. Open any place to see every number behind its score. If you switch gap-filling off, a place with published data for less than 75% of your weighted priorities is marked Not enough data instead.</p>
<h3 style="color:var(--fg)">Where each factor comes from</h3>
<div class="biastable"><table><thead><tr><th>Factor</th><th>Sources</th></tr></thead><tbody>${ROWS.en.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>
<h3 style="color:var(--fg)">Limits to know</h3>
<ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
<li>Numbeo indices come from user surveys, so they reflect perceptions. That's why they're averaged with official statistics (WHO, UNODC, FBI) where possible.</li>
<li>No city-level data is published for the Long Island towns or Tampico, so their city figures are filled in from national data. They come out like a typical US or Mexican city, which misses local quirks: East Hampton's beach climate or its total car dependence, for example. Their score ranges are wider for that reason.</li>
<li>National homicide rates hide large city differences; only US cities have city rates here.</li>
<li>The EIU index is from 2023 and the Gallup migrant index from 2016–2017 surveys, which covered only the most and least accepting countries.</li>
<li>Housing availability is the thinnest data here. The US has official vacancy rates by metro; most other places only have expat-survey ranks, often for the country rather than the city. Treat availability outside the US as a rough signal and check listings for any city you’re serious about.</li>
<li>Life satisfaction, women’s rights, LGBTQ+ acceptance and freedom are national figures, applied to every city in the country.</li>
<li>The job market is measured in general, not for your field; national unemployment says little about one city.</li>
<li>Wealth explains a lot: across cities, national GDP per person accounts for about 57% of the variation in Adriano’s scores (tests/wealth_bias.py). Richer places really do score better on most factors, but a ranking this tied to wealth also inherits whatever the sources miss about rich places.</li>
<li>Women’s rights, LGBTQ+ acceptance and politics describe laws and national or county averages. They don’t predict how any one person will be treated, and they miss differences between neighborhoods, workplaces and families.</li>
<li>Humidity, snowfall and future warming aren’t scored: no consistent source covering all 137 cities was found.</li>
<li>Race and ethnicity, religion, disability, and family needs like schools aren't scored.</li></ul>`,
es:`<p>Cada lugar recibe de 1 a 5 en diecinueve factores. Primero cuentan los datos publicados, las reglas oficiales y los cálculos. Donde faltan datos publicados, el valor se estima con un modelo estadístico probado y se marca como «estimado» con su error medido (ver la última sección). Las estimaciones hechas a mano se muestran en gris y quedan fuera del puntaje a menos que las actives. Donde existen dos fuentes confiables, se promedian para que ninguna encuesta decida sola un factor. Con el equilibrio de escalas activado, cada factor se reescala al mismo promedio y dispersión antes de ponderar. Veredictos: Muy buena opción desde 70, Viable desde 60, Con reservas desde 48, Evitar por debajo, más las reglas de descarte. Un lugar solo puede ser Muy buena opción si la vivienda, el mercado laboral, la salud, la seguridad, la libertad y el poder adquisitivo tienen cifras publicadas ahí, y los valores estimados son menos de una quinta parte de su puntaje. Si no, se queda en Viable aunque su puntaje sea alto. Dentro de cada veredicto, los lugares se ordenan por el extremo bajo de su rango probable, así que un lugar con muchos valores estimados no supera a otro con el mismo puntaje y todo medido. Abre cualquier lugar para ver cada número detrás de su puntaje. Si desactivas el llenado de huecos, un lugar con datos publicados para menos del 75% de tus prioridades ponderadas se marca como Datos insuficientes.</p>
<h3 style="color:var(--fg)">De dónde viene cada factor</h3>
<div class="biastable"><table><thead><tr><th>Factor</th><th>Fuentes</th></tr></thead><tbody>${ROWS.es.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>
<h3 style="color:var(--fg)">Límites que conviene saber</h3>
<ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
<li>Los índices de Numbeo vienen de encuestas a usuarios, así que reflejan percepciones. Por eso se promedian con estadísticas oficiales (OMS, UNODC, FBI) cuando es posible.</li>
<li>No hay datos publicados a nivel de ciudad para los pueblos de Long Island ni para Tampico, así que sus cifras se estiman con datos nacionales. Salen como una ciudad típica de EE. UU. o México, lo que no capta particularidades locales, como el clima de playa de East Hampton o su total dependencia del auto. Por eso sus rangos de puntaje son más amplios.</li>
<li>Las tasas nacionales de homicidio esconden grandes diferencias entre ciudades; solo las ciudades de EE. UU. tienen tasas propias aquí.</li>
<li>El índice de la EIU es de 2023 y el índice de migrantes de Gallup de encuestas de 2016–2017, que solo cubrieron los países más y menos receptivos.</li>
<li>La disponibilidad de vivienda es el dato más débil aquí. EE. UU. tiene tasas oficiales de vacantes por área metropolitana; la mayoría de los demás lugares solo tienen lugares en encuestas de expatriados, a menudo del país y no de la ciudad. Tómalo como una señal aproximada y revisa anuncios en cualquier ciudad que te interese en serio.</li>
<li>La satisfacción con la vida, los derechos de las mujeres, la aceptación LGBTQ+ y la libertad son cifras nacionales, aplicadas a todas las ciudades del país.</li>
<li>El mercado laboral se mide en general, no para tu campo; el desempleo nacional dice poco de una ciudad.</li>
<li>La riqueza explica mucho: entre ciudades, el PIB por persona del país explica cerca del 57% de la variación de los puntajes de Adriano (tests/wealth_bias.py). Los lugares ricos sí califican mejor en la mayoría de los factores, pero un ranking tan ligado a la riqueza también hereda lo que las fuentes no ven de los lugares ricos.</li>
<li>Los derechos de las mujeres, la aceptación LGBTQ+ y la política describen leyes y promedios nacionales o del condado. No predicen cómo van a tratar a una persona en particular, y no captan diferencias entre colonias, trabajos y familias.</li>
<li>No se califican la humedad, la nieve ni el calentamiento futuro: no se encontró una fuente consistente para las 137 ciudades.</li>
<li>No se califican la raza y el origen étnico, la religión, la discapacidad ni necesidades familiares como escuelas.</li></ul>`};

  if(store.get('take',null))$('resumeTake').hidden=false;
  RANKBY=store.get('rankBy','lo');
  if(params.get('t')){try{loadTake(dec(params.get('t')));applyHomes();recompute();$('vsPanel').hidden=false;setTimeout(()=>toast(L('sharedView')),60);}catch(e){}}
  else{const view=store.get('view','neutral');if(view==='adriano')setAdriano();else if(view==='yours'&&store.get('take',null)){try{loadTake(JSON.parse(store.get('take','null')));}catch(e){setNeutral();}}else setNeutral();applyHomes();}
  applyLang();refreshAll();offersUI();
})();

getWorld().then(fs=>{
  bindCountries(fs);
  snapshotAdriano();
  setTimeout(loadStates,300);
  const openDot=(d)=>{const n=[...CLUSTER.values()].filter(x=>x===d).length;if(n&&zoomK<8&&ui.proj!=='globe'){const p=proj([d.lon,d.lat]),k=Math.min(12,zoomK*2.5);goTo(d3.zoomIdentity.translate(VW/2-k*p[0],VH/2-k*p[1]).scale(k),500);}else select(d,false);};
  gCities.selectAll('circle').data(cities).join('circle').style('cursor','pointer').attr('tabindex',0).attr('role','button')
    .on('mousemove',(ev,d)=>showTip(ev,d)).on('mouseleave',hideTip)
    .on('click',(ev,d)=>{ev.stopPropagation();openDot(d);})
    .on('keydown',(ev,d)=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(d,true);$('detailSec').scrollIntoView({block:'start'});}});
  gLabels.selectAll('text').data(cities).join('text').attr('font-family',FONT).attr('paint-order','stroke').attr('stroke-linejoin','round');
  selectsUI();rebuild();refreshAll();
}).catch(()=>{$('mapbox').insertAdjacentHTML('beforeend',`<p class="maperr">${LANG==='es'?'No se pudo cargar el contorno del mapa. Los filtros, puntajes, comparaciones y el ranking siguen funcionando.':'The map outlines couldn’t load. Filters, scores, compare and the ranking still work.'}</p>`);});
})();
</script>
</body>
</html>
