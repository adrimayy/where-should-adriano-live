<!doctype html>
<html lang="en" data-v="71">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where Should You Live?</title>
<meta name="description" content="Every country and hundreds of cities scored on twenty-six factors from published data. Take a short quiz to get your own map.">
<meta property="og:title" content="Where Should You Live?">
<meta property="og:description" content="Take a short quiz and get a map of where you’d fit best, from published data.">
<!-- the loading wheel: styled here, not in the stylesheet, so it is on screen before anything else has arrived -->
<style>
#boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#f2f2f7}
#boot i,.mapbox.loading::after{width:40px;height:40px;border-radius:50%;border:4px solid rgba(15,118,110,.18);border-top-color:#0f766e;animation:bootspin .8s linear infinite}
@keyframes bootspin{to{transform:rotate(360deg)}}
@media (prefers-color-scheme:dark){#boot{background:#000}#boot i{border-color:rgba(60,198,180,.2);border-top-color:#3cc6b4}}
html.ready #boot{display:none}
</style>
<script>
// never leave the wheel up: it goes when the page is drawn (js/13-startup.js), on an error, or after 15 seconds
(function(){var done=function(){document.documentElement.classList.add('ready')};window.addEventListener('error',done);setTimeout(done,15000)})();
</script>
<link rel="stylesheet" href="css/atlas.css?v=71">
</head>
<body>
<div id="boot" role="status" aria-label="Loading"><i></i></div>
<div class="wrap">
  <div class="topbar">
    <button type="button" class="brand" id="brand" data-t="brand"></button>
    <select id="langSel" class="langsel" aria-label="Language / Idioma"></select>
  </div>

  <section class="panel hero" id="start">
    <h1 data-t="h1"></h1>
    <p class="lede" data-th="intro1"></p>
    <!-- one action: take the quiz. Nothing is scored on screen before that; a saved take opens straight on its results. -->
    <div class="cta"><button class="primary" id="startQuiz" data-t="startQuiz"></button></div>
    <p class="meta" data-t="startNote"></p>
  </section>

  <section class="panel" id="quizPanel" hidden aria-live="polite">
    <div class="qwrap" id="qwrap"></div>
  </section>

  <!-- the workspace. Everything a person can change sits in one panel (left and always open on wide screens; a sheet
       behind the Filters button on phones): what to show, where, and what matters. On phones one bar stays in reach:
       the find box, Filters, list or map, cities or countries. A place's details open over the page and close back to
       exactly where the person was. -->
  <div class="work" id="work">
  <aside class="ppanel" id="ppanel" aria-labelledby="ctlHead">
    <div class="phead"><h2 id="ctlHead" data-t="filters"></h2><button class="ghost pclose" id="pclose"></button></div>
    <div class="ctlsec" id="kindHome"><span class="lab" data-t="kindLab"></span></div>
    <div class="scopebar" id="scopeBar" hidden></div>
    <div class="filt" id="filt"><span class="lab" id="filtSum"></span><div class="pills" id="pills" role="group"></div></div>
    <div class="prio" id="prio"></div>
    <div class="pdone"><button class="primary" id="pdone" data-t="ctlDone"></button></div>
  </aside>
  <div class="workmain">
    <!-- results: the answer comes first. A title and two quiet actions, then straight into the list. -->
    <section class="reshead" id="resPanel" hidden>
      <div class="resrow">
        <h2 id="resHead"></h2>
        <div class="resacts"><button class="ghost" id="shareTake" data-t="share"></button><button class="ghost" id="retake" data-t="retake"></button><button class="ghost" id="toCmp" hidden></button></div>
      </div>
      <div class="toast" id="toast" role="status"></div>
      <p class="meta unsure" id="unsureNote" role="status" hidden></p>
      <div class="tops calc-only" id="resLists"></div>
      <div id="resDefaults" class="calc-only"></div>
    </section>
  <div class="bar" id="bar">
    <div class="barrow">
      <div class="searchhome" id="searchHome"><div class="searchbox" id="searchBox" role="search"><span class="sico" id="sico"></span><input id="search" type="search" autocomplete="off" enterkeyhint="search" role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list"><ul class="sugg" id="sugg" role="listbox" hidden></ul></div></div>
      <button class="ctlbtn" id="ctlBtn" aria-controls="ppanel" aria-expanded="false"></button>
    </div>
    <div class="barrow">
      <div class="seg" id="paneSeg" role="group"><button id="vList" aria-pressed="true" data-t="paneList"></button><button id="vMap" aria-pressed="false" data-t="paneMap"></button></div>
      <div id="kindBar"><div class="seg" id="kindSeg" role="group"><button id="rCities" aria-pressed="true" data-t="cities"></button><button id="rCountries" aria-pressed="false" data-t="countries"></button></div></div>
    </div>
  </div>
  <div class="split" id="split" data-pane="list">
  <section id="rankSec">
    <div class="listpane" id="listPane">
      <div class="rankhead">
        <h2 class="sr" data-t="ranking"></h2>
        <div class="seg calc-only" role="group"><button id="vScore" aria-pressed="true" data-t="viewScore"></button><button id="vProfile" aria-pressed="false" data-t="viewProfile"></button></div>
      </div>
      <p class="meta" id="rankmeta"></p>
      <div class="list" id="list"></div>
      <div class="listfoot"><button id="more" data-t="showAll"></button><button class="linkbtn" id="advBtn" aria-pressed="false"></button></div>
      <!-- after the answer: how to make it more precise -->
      <div class="sharpen" id="sharpen" hidden><p class="meta" id="sharpenNote"></p><div class="toggles"><button id="fullQuiz"></button><button class="ghost" id="tradeBtn" data-t="tradeBtn"></button></div></div>
    </div>
    <section class="panel" id="detail" hidden></section>
  </section>
  <section id="mapSec">
    <div class="rankhead">
      <div style="display:flex;flex-direction:column;gap:4px"><h2 data-t="mapTitle"></h2></div>
    </div>
    <details class="box calc-only" id="mapOpts">
      <summary><span data-t="optsTitle"></span><span class="meta" id="fsum" style="font-weight:400;margin-left:auto"></span></summary>
      <div class="inner">
        <div class="mapctl">
          <div class="field"><label class="lab" for="colorBy" data-t="colorBy"></label><select id="colorBy"></select></div>
        </div>
        <div class="field"><span class="lab" data-t="layers"></span><div class="toggles"><button class="chipbtn" id="tCountries" aria-pressed="true" data-t="countries"></button><button class="chipbtn" id="tDots" aria-pressed="false" data-t="dotsOnly"></button><button class="chipbtn" id="tCities" aria-pressed="true" data-t="cities"></button><button class="chipbtn" id="tLabels" aria-pressed="true" data-t="cityNames"></button><button class="chipbtn" id="tOpac" aria-pressed="false" data-t="shadeOpac"></button></div><p class="meta" data-t="dotsNote"></p></div>
        <div class="field"><span class="lab" data-t="verdicts"></span><div class="toggles" id="tierFilters"></div></div>
        <div class="field"><label class="lab" for="minScore" data-t="minScore"></label><div class="range"><input type="range" id="minScore" min="0" max="90" step="5" value="0"><output id="minOut">0</output></div></div>
        <div class="field"><span class="lab" data-t="mustHave"></span><div class="mustgrid" id="mustMenu"></div></div>
        <div><button id="freset" data-t="resetFilters"></button></div>
      </div>
    </details>
    <div class="toggles calc-only" id="regions" role="group" aria-label="Map view"></div>
    <div class="mapbox loading" id="mapbox">
      <canvas id="map" role="img" aria-label="World map"></canvas>
      <svg id="overlay" aria-label="Cities"></svg>
      <span class="maphint" id="maphint"></span>
      <div class="zoombtns"><button id="zin" aria-label="Zoom in"></button><button id="zout" aria-label="Zoom out"></button><button id="zreset" aria-label="Reset view"></button></div>
      <div class="tip" id="tip"></div>
      <div class="pcard" id="pcard" hidden></div>
    </div>
    <details class="howread calc-only"><summary data-t="howRead"></summary><p class="meta" data-t="namesRule"></p></details>
    <div class="legend" id="legend"></div>
  </section>
  </div>

  <section class="panel after" id="cmpPanel" hidden>
    <div style="display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap"><h2 data-t="compare"></h2><button id="cmpClear" data-t="clear"></button></div>
    <div class="cmp"><div class="cmpgrid" id="cmp"></div></div>
  </section>

  <details class="box after calc-only" id="weightsBox">
    <summary><span data-t="weightsTitle"></span></summary>
    <div class="inner wgrid">
      <div class="wmain">
      <p class="meta" data-t="weightsNote"></p>
      <div class="toggles"><div class="field"><label class="lab" for="preset" data-t="preset"></label><select id="preset"></select></div><button id="undoBtn" data-t="undo" disabled></button></div>
      <div id="weights" style="display:flex;flex-direction:column;gap:8px"></div>
      <div class="field"><span class="lab" data-t="homeBases"></span><div class="toggles"><select id="home1" aria-label="Home base 1"></select><select id="home2" aria-label="Home base 2"></select></div></div>
      <details class="sub"><summary data-t="secRules"></summary><div class="subin">
      <label class="check"><input type="checkbox" id="gate" checked><span data-t="gateLabel"></span></label>
      <label class="check"><input type="checkbox" id="gateOpen" checked><span data-t="gateOpenLabel"></span></label>
      <label class="check"><input type="checkbox" id="gateFar" checked><span data-t="gateFarLabel"></span></label>
      <label class="check"><input type="checkbox" id="gateHot" checked><span data-t="gateHotLabel"></span></label>
      <label class="check"><input type="checkbox" id="gateSmall" checked><span data-t="gateSmallLabel"></span></label>
      </div></details>
      <details class="sub"><summary data-t="secAdjust"></summary><div class="subin">
      <label class="check"><input type="checkbox" id="lasts"><span data-t="lastsLabel"></span></label>
      <label class="check"><input type="checkbox" id="reach"><span data-t="reachLabel"></span></label>
      </div></details>
      <details class="sub"><summary data-t="secStats"></summary><div class="subin">
      <label class="check"><input type="checkbox" id="useImp" checked><span data-t="impLabel"></span></label>
      <label class="check"><input type="checkbox" id="useEst"><span data-t="estLabel"></span></label>
      <label class="check"><input type="checkbox" id="norm" checked><span data-t="normLabel"></span></label>
      <label class="check"><input type="checkbox" id="useCont" checked><span data-t="contLabel"></span></label>
      <label class="check"><input type="checkbox" id="useME" checked><span data-t="meLabel"></span></label>
      <div class="mapctl">
        <div class="field"><label class="lab" for="rankBy" data-t="rankByLab"></label><select id="rankBy"></select></div>
        <div class="field"><label class="lab" for="aggSel" data-t="aggLab"></label><select id="aggSel"></select></div>
        <div class="field"><label class="lab" for="normM" data-t="normMLab"></label><select id="normM"></select></div>
        <div class="field"><label class="lab" for="happyM" data-t="happyLab"></label><select id="happyM"></select></div>
      </div>
      <p class="meta" data-t="rankByNote"></p>
      </div></details>
      <div id="effw"></div>
      </div>
      <aside class="live" id="liveTop" aria-live="polite"></aside>
    </div>
  </details>
  </div>
  </div>

  <details class="box after choices calc-only"><summary><span data-t="choicesTitle"></span></summary><div class="inner" data-th="choicesBody"></div></details>
  <details class="box after calc-only">
    <summary><span data-t="howTitle"></span></summary>
    <div class="inner foot" id="howInner"></div>
  </details>
  <footer class="pagefoot"><button type="button" class="quiet" id="fillBtn" tabindex="-1" aria-hidden="true"></button></footer>
</div>

<div class="sheetbg" id="sheetBg" hidden></div>
<div class="gtoast" id="gtoast" role="status" hidden></div>
<!-- Every file of the page's own carries the release number (?v=, and data-v on <html>), so a browser that kept
     the last release's files asks for the new ones together instead of mixing old code with a new page. Bump all of
     them on each release; tests/test_place.py checks they agree. -->
<!-- Libraries, then the data (one file, made by build.py), then the page code in order. "defer" downloads them all at once and runs them in this order. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script defer src="data/atlas.js?v=71"></script>
<script defer src="js/00-setup.js?v=71"></script>
<script defer src="js/01-strings.js?v=71"></script>
<script defer src="js/02-factors.js?v=71"></script>
<script defer src="js/03-geography.js?v=71"></script>
<script defer src="js/04-language-and-passport.js?v=71"></script>
<script defer src="js/05-entities.js?v=71"></script>
<script defer src="js/06-scoring.js?v=71"></script>
<script defer src="js/07-quiz.js?v=71"></script>
<script defer src="js/08-results.js?v=71"></script>
<script defer src="js/09-take-save.js?v=71"></script>
<script defer src="js/10-map.js?v=71"></script>
<script defer src="js/11-panels.js?v=71"></script>
<script defer src="js/12-events.js?v=71"></script>
<script defer src="js/13-startup.js?v=71"></script>
<dialog id="hpDialog" class="hpdlg" aria-label="Choose a place"><div class="hptop"><input id="hpSearch" type="search" autocomplete="off" enterkeyhint="search"><button type="button" id="hpCancel" class="hpcancel"></button></div><div class="hpbody"><div id="hpList" class="hplist"></div><nav id="hpRail" class="hprail" aria-label="A–Z"></nav></div></dialog>
</body>
</html>
