<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where Should Adriano Live?</title>
<meta name="description" content="Every country and 132 cities scored on eighteen factors for Adriano. Take a one-minute quiz to get your own map and see how you compare.">
<meta property="og:title" content="Where Should Adriano Live?">
<meta property="og:description" content="Take a one-minute quiz, get your own map, and see how you compare with Adriano.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: single column flow. Start card -> optional step quiz -> you vs Adriano -> map with place card -> ranking -> detail and compare -> collapsible weights and methods. */
:root{
  --bg:#f5f7f8; --panel:#ffffff; --fg:#14202b; --muted:#5a6873; --line:#dde3e8; --accent:#0f6d8c; --accent-fg:#ffffff;
  --ocean:#dbe7ef; --land-stroke:#ffffff; --grat:#c9d8e3; --chip-bg:#eef2f5; --off:#e4e9ed; --you:#7a5af0;
  --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --panel:#161f27; --fg:#e6edf2; --muted:#94a3ae; --line:#26323d; --accent:#4fb3d4; --accent-fg:#0b1218;
  --ocean:#13212d; --land-stroke:#0f151b; --grat:#1c2d3b; --chip-bg:#1d2a35; --off:#1f2a33; --you:#a08cff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --panel:#161f27; --fg:#e6edf2; --muted:#94a3ae; --line:#26323d; --accent:#4fb3d4; --accent-fg:#0b1218;
  --ocean:#13212d; --land-stroke:#0f151b; --grat:#1c2d3b; --chip-bg:#1d2a35; --off:#1f2a33; --you:#a08cff; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-0.01em}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1} h2{font-size:clamp(18px,4vw,21px)} h3{font-size:15px}
p{margin:0}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;padding-top:max(10px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(14px,env(safe-area-inset-left,0px)));padding-inline:max(14px,env(safe-area-inset-left,0px))}
.brand{font-family:var(--display);font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .meta{color:var(--muted);font-size:13.5px} .mono{font-family:var(--mono);font-size:12.5px}
button{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:500}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
button.chipbtn{min-height:36px;padding:6px 12px;font-size:13.5px}
button.chipbtn[aria-pressed="false"]{color:var(--muted);background:transparent;border-style:dashed}
button.chipbtn[aria-pressed="true"]{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=search]{font:inherit;font-size:15px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;max-width:100%}
input[type=range]{accent-color:var(--accent)}
.toggles{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--panel);gap:3px}
.seg button{border:0;min-height:34px;padding:5px 12px;border-radius:7px;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.hero{padding:22px 20px;gap:16px}
.hero .lede{color:var(--muted);max-width:66ch;font-size:16px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.cta button{min-height:46px;font-size:15px;padding-inline:18px}
.prio{display:flex;flex-wrap:wrap;gap:6px}
.prio span{font-size:12.5px;background:var(--chip-bg);border-radius:999px;padding:4px 10px}
.prio b{font-family:var(--mono);font-weight:500;color:var(--accent);margin-right:5px}
/* quiz */
.qwrap{display:flex;flex-direction:column;gap:16px}
.progress{height:6px;border-radius:3px;background:var(--chip-bg);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtitle{font-family:var(--display);font-size:clamp(20px,5vw,26px);font-weight:600;line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.opt{text-align:left;min-height:54px;padding:12px 14px;font-size:15px;border-radius:12px;display:flex;align-items:center;gap:10px}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt[aria-pressed="true"] .dot{border-color:var(--accent);background:var(--accent)}
.qnav{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
/* compare with Adriano */
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.vs .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.vs ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.vs li{font-size:14.5px}
.vs li .s{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:6px}
.shared{font-size:11px;font-family:var(--mono);color:var(--accent);margin-left:6px;text-transform:uppercase;letter-spacing:.04em}
.match{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.match .big{font-family:var(--display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.diffs ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
/* map */
.mapctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
details.box{background:var(--panel);border:1px solid var(--line);border-radius:14px}
details.box>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:500;min-height:46px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-size:18px}
details.box[open]>summary::after{content:"−"}
details.box>.inner{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.range{display:flex;align-items:center;gap:8px}
.range input{width:160px;max-width:50vw}
.range output{font-family:var(--mono);font-size:13px;min-width:24px}
.mapbox{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--ocean)}
.mapbox svg{display:block;width:100%;height:auto;touch-action:pan-y;cursor:grab}
.zoombtns{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoombtns button{width:40px;padding:0;font-size:18px;line-height:1}
.maphint{position:absolute;left:10px;top:10px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;opacity:.92}
.tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.4;max-width:250px;opacity:0;transition:opacity .12s}
.pcard{position:absolute;left:10px;right:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pcard .nm{font-family:var(--display);font-weight:600;font-size:16px}
.pcard .sc2{font-family:var(--mono);font-size:13px;color:var(--muted)}
.pcard .acts{margin-left:auto;display:flex;gap:6px}
.pcard .acts button{min-height:36px;padding:5px 10px;font-size:13px}
.maperr{position:absolute;left:16px;right:16px;top:16px;color:var(--muted);font-size:13.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ramp{display:inline-flex;align-items:center;gap:8px}
.ramp span.bar{display:inline-block;width:130px;height:10px;border-radius:5px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--chip-bg);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
/* detail */
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.big{font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:15px;color:var(--muted);margin-left:2px}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:170px minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:13.5px}
.track{height:8px;border-radius:4px;background:var(--chip-bg);overflow:hidden;position:relative}
.fill{display:block;height:100%;border-radius:4px}
.brow .v{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted);white-space:nowrap}
.brow.weak .lbl{font-weight:500}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-left:6px}
.wrow{display:grid;grid-template-columns:170px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13.5px}
.wrow input{width:100%}
.wrow output{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--muted)}
.wrow .adw{position:absolute}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.check input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.mustgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px 16px}
.cmp{overflow-x:auto}
.cmpgrid{display:grid;gap:6px 14px;align-items:center;font-size:13.5px;min-width:480px}
.cmpgrid .h{font-weight:600;font-family:var(--display);font-size:15px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.cmpgrid .h button{min-height:28px;padding:0 8px;font-size:12px}
.cell{display:flex;align-items:center;gap:8px}
.cell .track{flex:1}
/* ranking */
.rankhead{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:10px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:34px minmax(0,1.3fr) 120px minmax(0,1.5fr);gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px;background:none;border-left:0;border-right:0;border-top:0;border-radius:0;text-align:left;min-height:0;width:100%}
.row:hover{background:var(--chip-bg)}
.row .n{font-family:var(--mono);color:var(--muted);font-size:12.5px}
.row .why{color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rng{display:block;font-size:10.5px;color:var(--muted);line-height:1.1}
.row .ad{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:block}
.sc{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.sc .track{flex:1}
@media (max-width:600px){
  .row{grid-template-columns:28px minmax(0,1fr) 96px}.row .why{grid-column:2 / 4;white-space:normal}
  .brow{grid-template-columns:118px minmax(0,1fr) 70px}.wrow{grid-template-columns:120px minmax(0,1fr) 46px}.brow .v{font-size:11px}
  .pcard{position:relative;left:auto;right:auto;bottom:auto;margin:0 8px 8px}
  .pcard .acts{margin-left:0;width:100%}.pcard .acts button{flex:1}.pcard .acts #pcX{flex:0 0 44px}
  .hero{padding:18px 16px}
}
.foot{color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;gap:10px}
.foot p{max-width:85ch}
.biastable{overflow-x:auto}
.biastable table{border-collapse:collapse;min-width:620px;font-size:13px;width:100%}
.biastable th,.biastable td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.biastable th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.biastable td:first-child{color:var(--fg);font-weight:500}
.toast{font-size:13.5px;color:var(--accent);min-height:1.2em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="brand" data-t="brand"></span>
    <div class="seg" role="group" aria-label="Language"><button id="lEn" aria-pressed="true">EN</button><button id="lEs" aria-pressed="false">ES</button></div>
  </div>

  <section class="panel hero" id="start">
    <span class="eyebrow" data-t="eyebrow"></span>
    <h1 data-t="h1"></h1>
    <p class="lede" data-th="intro1"></p>
    <p class="lede" data-th="intro2"></p>
    <div style="display:flex;flex-direction:column;gap:6px"><span class="lab" data-t="prioTitle"></span><div class="prio" id="prio"></div></div>
    <div class="cta"><button class="primary" id="startQuiz" data-t="startQuiz"></button><button id="skipQuiz" data-t="skipQuiz"></button><button class="ghost" id="resumeTake" hidden data-t="resume"></button></div>
    <p class="meta" data-t="startNote"></p>
  </section>

  <section class="panel" id="quizPanel" hidden aria-live="polite">
    <div class="qwrap" id="qwrap"></div>
  </section>

  <section class="panel" id="vsPanel" hidden>
    <div class="dhead">
      <div style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow" data-t="vsEyebrow"></span><h2 data-t="vsTitle"></h2></div>
      <div class="match"><span class="big" id="matchPct">0%</span><span class="meta" data-t="matchLabel"></span></div>
    </div>
    <div class="vs" id="vsLists"></div>
    <div class="diffs" id="vsDiffs"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="toggles"><button class="primary" id="shareTake" data-t="share"></button><button id="retake" data-t="retake"></button><button class="ghost" id="toMap" data-t="toMap"></button></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:12px" id="mapSec">
    <div class="rankhead">
      <div style="display:flex;flex-direction:column;gap:4px"><h2 data-t="mapTitle"></h2><p class="meta" id="modeNote"></p></div>
      <div class="seg" role="group" aria-label="Whose take"><button id="mAdriano" aria-pressed="true" data-t="adTake"></button><button id="mYours" aria-pressed="false" data-t="yourTake"></button></div>
    </div>
    <details class="box" id="mapOpts">
      <summary><span data-t="optsTitle"></span><span class="meta" id="fsum" style="font-weight:400;margin-left:auto"></span></summary>
      <div class="inner">
        <div class="mapctl">
          <div class="field"><label class="lab" for="colorBy" data-t="colorBy"></label><select id="colorBy"></select></div>
          <div class="field"><label class="lab" for="styleSel" data-t="mapStyle"></label><select id="styleSel"></select></div>
          <div class="field"><label class="lab" for="projSel" data-t="projection"></label><select id="projSel"></select></div>
          <div class="field"><label class="lab" for="search" data-t="find"></label><input id="search" type="search" list="names" autocomplete="off"><datalist id="names"></datalist></div>
        </div>
        <div class="field"><span class="lab" data-t="layers"></span><div class="toggles"><button class="chipbtn" id="tCountries" aria-pressed="true" data-t="countries"></button><button class="chipbtn" id="tCities" aria-pressed="true" data-t="cities"></button><button class="chipbtn" id="tLabels" aria-pressed="false" data-t="cityNames"></button></div></div>
        <div class="field"><span class="lab" data-t="verdicts"></span><div class="toggles" id="tierFilters"></div></div>
        <div class="field"><label class="lab" for="minScore" data-t="minScore"></label><div class="range"><input type="range" id="minScore" min="0" max="90" step="5" value="0"><output id="minOut">0</output></div></div>
        <div class="field"><span class="lab" data-t="mustHave"></span><div class="mustgrid" id="mustMenu"></div></div>
        <div><button id="freset" data-t="resetFilters"></button></div>
      </div>
    </details>
    <div class="mapbox" id="mapbox">
      <svg id="map" role="img" aria-label="World map"></svg>
      <span class="maphint" id="maphint"></span>
      <div class="zoombtns"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zreset" aria-label="Reset view" style="font-size:14px">⟲</button></div>
      <div class="tip" id="tip"></div>
      <div class="pcard" id="pcard" hidden></div>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:12px">
    <div class="rankhead">
      <div style="display:flex;flex-direction:column;gap:4px"><h2 data-t="ranking"></h2><p class="meta" id="rankmeta"></p></div>
      <div class="seg" role="group"><button id="rCities" aria-pressed="true" data-t="cities"></button><button id="rCountries" aria-pressed="false" data-t="countries"></button></div>
    </div>
    <div class="list" id="list"></div>
    <div><button id="more" data-t="showAll"></button></div>
  </section>

  <div class="grid2" id="detailSec">
    <section class="panel" id="detail" aria-live="polite"></section>
    <section class="panel" id="cmpPanel">
      <div style="display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap"><h2 data-t="compare"></h2><button id="cmpClear" data-t="clear"></button></div>
      <div class="cmp"><div class="cmpgrid" id="cmp"></div></div>
    </section>
  </div>

  <details class="box" id="weightsBox">
    <summary><span data-t="weightsTitle"></span></summary>
    <div class="inner">
      <p class="meta" data-t="weightsNote"></p>
      <div class="field"><label class="lab" for="preset" data-t="preset"></label><select id="preset"></select></div>
      <div id="weights" style="display:flex;flex-direction:column;gap:8px"></div>
      <div class="field"><span class="lab" data-t="homeBases"></span><div class="toggles"><select id="home1" aria-label="Home base 1"></select><select id="home2" aria-label="Home base 2"></select></div></div>
      <label class="check"><input type="checkbox" id="useImp" checked><span data-t="impLabel"></span></label>
      <label class="check"><input type="checkbox" id="useEst"><span data-t="estLabel"></span></label>
      <label class="check"><input type="checkbox" id="norm" checked><span data-t="normLabel"></span></label>
      <label class="check"><input type="checkbox" id="gate" checked><span data-t="gateLabel"></span></label>
      <label class="check"><input type="checkbox" id="gateOpen" checked><span data-t="gateOpenLabel"></span></label>
      <label class="check"><input type="checkbox" id="gateFar" checked><span data-t="gateFarLabel"></span></label>
    </div>
  </details>

  <details class="box">
    <summary><span data-t="howTitle"></span></summary>
    <div class="inner foot" id="howInner"></div>
  </details>

en:[['Healthcare access',`${A('uhc','WHO UHC Service Coverage Index 2023')} (country) averaged with the ${A('nqol','Numbeo Health Care Index 2026')} (city). The WHO index measures which services exist, not who is covered, so where many people have no coverage that is averaged in too: the US (7.9% uninsured all year, Census 2025) and Mexico (39.1% without access to health services, CONEVAL 2022).`],

 ['Short commutes',`${A('nqol','Numbeo Traffic Commute Time Index')}`],
 ['Housing you can get, living alone',`Two parts, averaged. Affordability: Numbeo rent index divided by the local salary level (purchasing power × cost of living), so rent is compared with what people there earn. Availability: official rental vacancy where published (${A('censusmsa','Census by metro')}, ${A('nychvs','NYC survey')}), otherwise how hard expats say it is to find a place (InterNations ${A('eic','city')} and country surveys). Availability data is patchy outside the US; where a city has none, its country’s figure is used.`],
 ['Job market',`The size of the metro economy (${A('gdp','GDP by metro area')}, counted twice), national ${A('iloy','unemployment for ages 15–24')} and the ${A('inf','share of informal jobs')}. It measures the general market, not your field. Field-specific numbers are hand estimates, off by default.`],
 ['Things happening','Metro population, as a stand-in: there is no global count of concerts, venues or events, but bigger metros reliably have more. Cities only.'],
 ['Welcoming to newcomers',`InterNations Expat Insider ranks for ease of settling in and finding friends (${A('ei','2025 countries')}, ${A('eisp','2024 cities')}). The ${A('mai','Gallup Migrant Acceptance Index')} is used only where no Expat Insider rank exists.`],

 ['Tech job market (when your field is tech or software)',`The general job market averaged with the city’s rank in the ${A('sblink','StartupBlink Global Startup Ecosystem Index 2025')}, which ranks 1,000 cities on startups, scale-ups, investment and tech business activity. Top 10 = 5, 11–30 = 4, 31–75 = 3, 76–200 = 2, lower or unranked = 1. A country uses its best-ranked city. It measures the tech ecosystem, not job postings, so treat it as a strong signal, not a count of openings.`],
 ['Jobs in other specific fields','No published global data for finance, healthcare, creative work or research. Those fields use the general job market; hand estimates are available but off unless you turn them on.']],
es:[['Acceso a la salud',`${A('uhc','Índice de Cobertura de Servicios de la OMS 2023')} (país) promediado con el ${A('nqol','Índice de Atención Médica de Numbeo 2026')} (ciudad). El índice de la OMS mide qué servicios existen, no quién está cubierto, así que donde mucha gente no tiene cobertura también se promedia: EE. UU. (7.9% sin seguro todo el año, Censo 2025) y México (39.1% sin acceso a servicios de salud, CONEVAL 2022).`],

 ['Trayectos cortos',`${A('nqol','Índice de Tiempo de Traslado de Numbeo')}`],
 ['Vivienda que puedes conseguir viviendo solo',`Dos partes, promediadas. Accesibilidad: el índice de renta de Numbeo dividido entre el nivel salarial local (poder adquisitivo × costo de vida), para comparar la renta con lo que gana la gente ahí. Disponibilidad: vacantes oficiales de renta donde se publican (${A('censusmsa','Censo por área metropolitana')}, ${A('nychvs','encuesta de NYC')}), si no, qué tan difícil dicen los expatriados que es encontrar lugar (encuestas de InterNations por ${A('eic','ciudad')} y país). Fuera de EE. UU. los datos de disponibilidad son incompletos; si una ciudad no tiene, se usa la cifra de su país.`],
 ['Mercado laboral',`El tamaño de la economía metropolitana (${A('gdp','PIB por área metropolitana')}, cuenta doble), el ${A('iloy','desempleo nacional de 15 a 24 años')} y la ${A('inf','proporción de empleo informal')}. Mide el mercado en general, no tu campo. Las cifras por campo son estimaciones a mano, apagadas por defecto.`],
 ['Que pasen cosas','Población metropolitana, como aproximación: no existe un conteo global de conciertos, recintos o eventos, pero las áreas más grandes tienen más. Solo ciudades.'],

const HOW={
en:`<p>Each place gets 1 to 5 on eighteen factors. Published data, official rules and calculations come first. Where published data is missing, the value is filled in by a tested statistical model and marked "filled in" with its measured error (see the last section). Hand-made estimates are shown greyed out and left out of the score unless you turn them on. Where two reputable sources exist, their scores are averaged so no single survey decides a factor. With scale balancing on, every factor is rescaled to the same average and spread before weighting. Verdicts: Strong fit at 70 and up, Workable at 60, Caution at 48, Avoid below that, plus the dealbreaker rules. A place can only be a Strong fit if housing, the job market, healthcare, safety, freedom and purchasing power all have published figures there, and filled-in values make up less than a fifth of its score. Otherwise it is held at Workable, however high it scores. Within each verdict, places are ordered by the low end of their likely range, so a place with many filled-in values doesn’t outrank an equally scored place that is fully measured. Open any place to see every number behind its score. If you switch gap-filling off, a place with published data for less than 75% of your weighted priorities is marked Not enough data instead.</p>
<h3 style="color:var(--fg)">Where each factor comes from</h3>
<div class="biastable"><table><thead><tr><th>Factor</th><th>Sources</th></tr></thead><tbody>${ROWS.en.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>
<h3 style="color:var(--fg)">Limits to know</h3>
<ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
<li>Numbeo indices come from user surveys, so they reflect perceptions. That's why they're averaged with official statistics (WHO, UNODC, FBI) where possible.</li>
<li>No city-level data is published for the Long Island towns or Tampico, so their city figures are filled in from national data. They come out like a typical US or Mexican city, which misses local quirks: East Hampton's beach climate or its total car dependence, for example. Their score ranges are wider for that reason.</li>
<li>National homicide rates hide large city differences; only US cities have city rates here.</li>
<li>The EIU index is from 2023 and the Gallup migrant index from 2016–2017 surveys, which covered only the most and least accepting countries.</li>
<li>Housing availability is the thinnest data here. The US has official vacancy rates by metro; most other places only have expat-survey ranks, often for the country rather than the city. Treat availability outside the US as a rough signal and check listings for any city you’re serious about.</li>
<li>Life satisfaction, women’s rights, LGBTQ+ acceptance and freedom are national figures, applied to every city in the country.</li>
<li>The job market is measured in general, not for your field, and national unemployment says little about one city, which is why the city’s own economy counts twice.</li>
<li>Race and ethnicity, religion, disability, and family needs like schools aren't scored.</li></ul>`,
es:`<p>Cada lugar recibe de 1 a 5 en dieciocho factores. Primero cuentan los datos publicados, las reglas oficiales y los cálculos. Donde faltan datos publicados, el valor se estima con un modelo estadístico probado y se marca como «estimado» con su error medido (ver la última sección). Las estimaciones hechas a mano se muestran en gris y quedan fuera del puntaje a menos que las actives. Donde existen dos fuentes confiables, se promedian para que ninguna encuesta decida sola un factor. Con el equilibrio de escalas activado, cada factor se reescala al mismo promedio y dispersión antes de ponderar. Veredictos: Muy buena opción desde 70, Viable desde 60, Con reservas desde 48, Evitar por debajo, más las reglas de descarte. Un lugar solo puede ser Muy buena opción si la vivienda, el mercado laboral, la salud, la seguridad, la libertad y el poder adquisitivo tienen cifras publicadas ahí, y los valores estimados son menos de una quinta parte de su puntaje. Si no, se queda en Viable aunque su puntaje sea alto. Dentro de cada veredicto, los lugares se ordenan por el extremo bajo de su rango probable, así que un lugar con muchos valores estimados no supera a otro con el mismo puntaje y todo medido. Abre cualquier lugar para ver cada número detrás de su puntaje. Si desactivas el llenado de huecos, un lugar con datos publicados para menos del 75% de tus prioridades ponderadas se marca como Datos insuficientes.</p>
<h3 style="color:var(--fg)">De dónde viene cada factor</h3>
<div class="biastable"><table><thead><tr><th>Factor</th><th>Fuentes</th></tr></thead><tbody>${ROWS.es.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>
<h3 style="color:var(--fg)">Límites que conviene saber</h3>
<ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
<li>Los índices de Numbeo vienen de encuestas a usuarios, así que reflejan percepciones. Por eso se promedian con estadísticas oficiales (OMS, UNODC, FBI) cuando es posible.</li>
<li>No hay datos publicados a nivel de ciudad para los pueblos de Long Island ni para Tampico, así que sus cifras se estiman con datos nacionales. Salen como una ciudad típica de EE. UU. o México, lo que no capta particularidades locales, como el clima de playa de East Hampton o su total dependencia del auto. Por eso sus rangos de puntaje son más amplios.</li>
<li>Las tasas nacionales de homicidio esconden grandes diferencias entre ciudades; solo las ciudades de EE. UU. tienen tasas propias aquí.</li>
<li>El índice de la EIU es de 2023 y el índice de migrantes de Gallup de encuestas de 2016–2017, que solo cubrieron los países más y menos receptivos.</li>
<li>La disponibilidad de vivienda es el dato más débil aquí. EE. UU. tiene tasas oficiales de vacantes por área metropolitana; la mayoría de los demás lugares solo tienen lugares en encuestas de expatriados, a menudo del país y no de la ciudad. Tómalo como una señal aproximada y revisa anuncios en cualquier ciudad que te interese en serio.</li>
<li>La satisfacción con la vida, los derechos de las mujeres, la aceptación LGBTQ+ y la libertad son cifras nacionales, aplicadas a todas las ciudades del país.</li>
<li>El mercado laboral se mide en general, no para tu campo, y el desempleo nacional dice poco de una ciudad, por eso la economía de la propia ciudad cuenta doble.</li>
<li>No se califican la raza y el origen étnico, la religión, la discapacidad ni necesidades familiares como escuelas.</li></ul>`};

function dayHours(lat){const r=Math.PI/180,phi=Math.abs(lat)*r,d=23.44*r,h0=-0.833*r;let c=(Math.sin(h0)+Math.sin(phi)*Math.sin(d))/(Math.cos(phi)*Math.cos(d));c=Math.max(-1,Math.min(1,c));return 2*Math.acos(c)/r/15;}
function dayScore(h){return h>=10.25?5:h>=9.1?4:h>=8.4?3:h>=7.6?2:1;}
function km(a,b){const r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;const s=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(s));}
function flightH(a,b){return km(a,b)/830+0.75;}
function famBand(t){return t<=3.5?5:t<=6?4:t<=8.5?3:t<=12?2:1;}
function setGeo(e,lat,lon,approx){e.lat0=lat;e.lon0=lon;e.dayH=dayHours(lat);e.sc.day=dayScore(e.dayH);e.geoApprox=approx;e.hasGeo=true;famFor(e);}
const SMALL_AIRPORT=new Set(['city:Tampico','city:East Hampton','city:Southampton','city:Montauk','city:Riverhead']);
function tripH(a,h){const o=TRIPS[a.key+'|'+h.key];if(o>0)return o;const d=km([a.lat0,a.lon0],[h.lat0,h.lon0]);if(d<500)return d/60;return d/830+0.75+(SMALL_AIRPORT.has(h.key)&&d>1500?2.5:0);}
function famFor(e){if(!e.hasGeo)return;e.flights=HOMES.map(h=>tripH(e,h));e.sc.fam=HOMES.length?Math.round(d3.mean(e.flights.map(famBand))):null;}

const EU=new Set([40,56,100,191,196,203,208,233,246,250,276,300,348,372,380,428,440,442,528,616,620,642,703,705,724,752]);

function langFor(e,m){if(e.base.lang==null)return null;switch(m){case 'en':return engScore(e);case 'enok':return okayEng(engScore(e));case 'es':return spaScore(e);case 'esen':return Math.max(spaScore(e),okayEng(engScore(e)));default:return e.base.lang;}}

/* ---------------- scoring ---------------- */
let gateFar=true,W={...PRESETS.mine},gate=true,gateOpen=true,norm=true,MODE='adriano',QUIZW=null;
let STATS={};
function computeStats(){STATS={};FACTORS.forEach(f=>{const v=ents.filter(e=>listable(e)&&e.v&&e.v[f.k]!=null).map(e=>e.v[f.k]);STATS[f.k]={m:d3.mean(v)||3,sd:d3.deviation(v)||1};});}
function nv(k,v){if(!norm)return v;const s=STATS[k];return Math.max(1,Math.min(5,3+(v-s.m)/s.sd));}
function backed(e,k){
  if(CALC.has(k)||RULES.has(k))return true;
  if(k==='clim'&&CLIMMODE!=='mild')return !!e.hasGeo;
  if(k==='pay'&&FIELD==='remote')return e.src.has('cost');
  return e.src.has(k);
}
const counts=(e,k)=>useEst||backed(e,k);
function resolve(e){
  e.v={};e.sd={};e.how={};
  FACTORS.forEach(f=>{const k=f.k,raw=e.sc[k];
    if(k==='jobs'&&useEst&&fieldJobs(e)!=null){e.v[k]=fieldJobs(e);e.sd[k]=1;e.how[k]='est';return;}
    if(raw!=null&&backed(e,k)){e.v[k]=raw;e.sd[k]=0;e.how[k]='obs';return;}
    const ik=(k==='pay'&&FIELD==='remote')?'cost':k,im=e.imp&&e.imp[ik];
    if(useImp&&im&&IMPUTABLE.has(k)&&!(k==='clim'&&CLIMMODE!=='mild')){e.v[k]=im[0];e.sd[k]=im[1]||1;e.how[k]='imp';return;}
    if(useEst&&raw!=null){e.v[k]=raw;e.sd[k]=1;e.how[k]='est';return;}
    e.v[k]=null;e.how[k]='none';});
  // tech/software: the job market is averaged with the city's tech-ecosystem rank
  const tb=FIELD==='tech'?techOf(e):null;
  if(tb!=null&&e.how.jobs!=='est'){const j=e.v.jobs;if(j==null){e.v.jobs=e.sc.jobs=tb;e.how.jobs='obs';e.sd.jobs=0;}else if(e.how.jobs==='obs')e.v.jobs=e.sc.jobs=(j+tb)/2;else{e.v.jobs=(j+tb)/2;e.sd.jobs=(e.sd.jobs||1)/2;}}
}
function evaluate(e){
  const sc=e.sc,V=e.v;let tot=0,sw=0,swImp=0;const part={};

  if(MODE!=='yours'&&ui.colorBy==='vs'){ui.colorBy='tier';$('colorBy').value='tier';}
}
let _rq=0;function refreshSoon(){if(_rq)return;_rq=requestAnimationFrame(()=>{_rq=0;refreshAll();saveTake();});}
function refreshAll(){recompute();syncMode();paint();list();detail(ui.sel);renderCmp();renderVs();}
function showMap(){$('mapSec').scrollIntoView({block:'start'});}
function tierFilters(){
  $('tierFilters').innerHTML=TIERS.map(t=>`<button class="chipbtn" data-t="${t}" aria-pressed="${ui.tiers.has(t)}"><span class="sw" style="background:${TIERCOL[t]}"></span>${L('tiers')[t]}</button>`).join('');
  $('tierFilters').querySelectorAll('button').forEach(b=>b.onclick=()=>{const t=b.dataset.t;ui.tiers.has(t)?ui.tiers.delete(t):ui.tiers.add(t);b.setAttribute('aria-pressed',ui.tiers.has(t));filtersChanged();});
}
function mustUI(){
  $('mustMenu').innerHTML=FACTORS.map(f=>`<label class="check"><input type="checkbox" data-k="${f.k}" ${ui.must.has(f.k)?'checked':''}><span>${FL(f.k)}</span></label>`).join('');
  $('mustMenu').querySelectorAll('input').forEach(c=>c.onchange=()=>{c.checked?ui.must.add(c.dataset.k):ui.must.delete(c.dataset.k);filtersChanged();});
}
function filtersChanged(){ui.showAll=false;paint();list();}
function selectsUI(){
  const co=$('colorBy');co.innerHTML=Object.entries(L('colorOpts')).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')+FACTORS.map(f=>`<option value="f:${f.k}">${FL(f.k)}</option>`).join('');
  if(![...co.options].some(o=>o.value===ui.colorBy))ui.colorBy='tier';co.value=ui.colorBy;
  $('styleSel').innerHTML=Object.entries(L('styles')).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');$('styleSel').value=ui.style;
  $('projSel').innerHTML=Object.entries(L('projs')).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');$('projSel').value=ui.proj;
  $('search').placeholder=L('findPh');
  $('names').innerHTML=orderedPlaces(false).flatMap(([g,arr])=>arr).map(e=>`<option value="${dn(e)}">`).join('');
}
function impSection(){
  const M=DATA.meta||{},ac=M.acc_country||{},ai=M.acc_city||{},ks=[...new Set([...Object.keys(ac),...Object.keys(ai)])].filter(k=>k!=='cost');
  const cell=o=>o&&isFinite(o.mae)?`${o.mae.toFixed(2)} <span class="muted">(n=${o.n})</span>`:'—';
  return `<h3 style="color:var(--fg)">${L('impTitle')}</h3><p>${fmt(L('impBody'),{c:Math.round((M.country_filled||0)*100),y:Math.round((M.city_filled||0)*100)})}</p>
  <div class="biastable"><table><thead><tr><th>${L('impFactor')}</th><th>${L('impCountries')}</th><th>${L('impCities')}</th></tr></thead><tbody>${ks.map(k=>`<tr><td>${FL(k)}</td><td>${cell(ac[k])}</td><td>${cell(ai[k])}</td></tr>`).join('')}</tbody></table></div><p>${L('impNote')}</p>`;
}
function applyLang(){
  document.documentElement.lang=LANG;document.title=STR[LANG].brand.replace(/^¿/,'¿');
  $('lEn').setAttribute('aria-pressed',LANG==='en');$('lEs').setAttribute('aria-pressed',LANG==='es');
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=L(el.dataset.t);});
  document.querySelectorAll('[data-th]').forEach(el=>{el.innerHTML=L(el.dataset.th);});
  $('prio').innerHTML=L('prio').map((p,i)=>`<span><b>${i+1}</b>${p}</span>`).join('');
  $('howInner').innerHTML=HOW[LANG]+impSection()+`<p class="stamp" style="color:var(--muted);font-size:12px">${LANG==='es'?'Datos actualizados':'Data updated'} 2026-11-10 · ${132} ${LANG==='es'?'ciudades':'cities'}</p>`+(FEEDBACK_URL?`<p><a href="${FEEDBACK_URL}" target="_blank" rel="noopener">${L('feedback')}</a></p>`:'');
  selectsUI();weightsUI();tierFilters();mustUI();syncMode();
  if(!$('quizPanel').hidden)renderQuiz();
  paint();list();detail(ui.sel);renderCmp();renderVs();
  if(zoom)$('maphint').textContent=touch?L('hintTouch'):L('hintMouse');
}

/* ---------------- events ---------------- */
$('lEn').onclick=()=>{LANG='en';store.set('lang','en');applyLang();};
$('lEs').onclick=()=>{LANG='es';store.set('lang','es');applyLang();};
$('startQuiz').onclick=startQuiz;
$('skipQuiz').onclick=()=>{$('quizPanel').hidden=true;MODE='adriano';W={...PRESETS.mine};HOMES=homesFromKeys(ADRIANO_HOMES);LANGMODE='both';PERMMODE='usmx';FIELD='tech';CLIMMODE='mild';gate=gateOpen=norm=gateFar=true;useEst=false;useImp=true;applyHomes();weightsUI();refreshAll();showMap();};
$('resumeTake').onclick=()=>{try{loadTake(JSON.parse(store.get('take','null')));applyHomes();weightsUI();refreshAll();$('vsPanel').hidden=false;$('vsPanel').scrollIntoView({block:'start'});}catch(e){}};
$('retake').onclick=startQuiz;
$('toMap').onclick=showMap;
$('mAdriano').onclick=()=>{$('skipQuiz').onclick();$('vsPanel').hidden=true;};
$('mYours').onclick=()=>{const s=store.get('take',null);if(s){$('resumeTake').onclick();}else startQuiz();};
$('shareTake').onclick=()=>{const url=location.href.split('#')[0]+'#t='+enc(takeState())+(LANG==='es'?'&l=es':'');
  const ok=()=>toast(L('copied'));if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(ok,()=>window.prompt(L('copyPrompt'),url));else window.prompt(L('copyPrompt'),url);};
$('colorBy').onchange=e=>{ui.colorBy=e.target.value;store.set('colorBy',ui.colorBy);paint();};
$('styleSel').onchange=e=>{ui.style=e.target.value;store.set('style',ui.style);drawGeo();paint();};
$('projSel').onchange=e=>{ui.proj=e.target.value;store.set('proj',ui.proj);rebuild();};
const press=(id,v)=>$(id).setAttribute('aria-pressed',v);
$('tCountries').onclick=()=>{ui.showC=!ui.showC;press('tCountries',ui.showC);paint();};
$('tCities').onclick=()=>{ui.showD=!ui.showD;press('tCities',ui.showD);paint();};
$('tLabels').onclick=()=>{ui.labels=!ui.labels;press('tLabels',ui.labels);paint();};
$('rCities').onclick=()=>{ui.rankType='city';press('rCities',true);press('rCountries',false);ui.showAll=false;list();legend();};
$('rCountries').onclick=()=>{ui.rankType='country';press('rCountries',true);press('rCities',false);ui.showAll=false;list();legend();};
$('more').onclick=()=>{ui.showAll=true;list();};
$('minScore').oninput=e=>{ui.minScore=+e.target.value;$('minOut').textContent=ui.minScore;filtersChanged();};
$('freset').onclick=()=>{ui.tiers=new Set(TIERS);ui.minScore=0;ui.must.clear();$('minScore').value=0;$('minOut').textContent='0';tierFilters();mustUI();filtersChanged();};
$('preset').onchange=e=>{const v=e.target.value;const src=v==='quiz'?QUIZW:PRESETS[v];if(!src)return;if(v!=='mine'||MODE==='yours')becomeYours();W={...src};weightsUI();$('preset').value=MODE==='adriano'?'mine':v;refreshAll();saveTake();};
$('norm').onchange=e=>{becomeYours();norm=e.target.checked;refreshAll();saveTake();};
$('useEst').onchange=e=>{becomeYours();useEst=e.target.checked;refreshAll();saveTake();};
$('useImp').onchange=e=>{becomeYours();useImp=e.target.checked;refreshAll();saveTake();};
$('gate').onchange=e=>{becomeYours();gate=e.target.checked;refreshAll();saveTake();};
$('gateOpen').onchange=e=>{becomeYours();gateOpen=e.target.checked;refreshAll();saveTake();};
$('gateFar').onchange=e=>{becomeYours();gateFar=e.target.checked;refreshAll();saveTake();};
$('cmpClear').onclick=()=>{ui.cmp=[];renderCmp();detail(ui.sel);pcard();};
$('search').oninput=()=>list();
$('search').onchange=e=>{const v=e.target.value.trim().toLowerCase();const hit=ents.find(x=>listable(x)&&(dn(x).toLowerCase()===v||x.name.toLowerCase()===v));if(hit){select(hit,true);}};
$('zin').onclick=()=>zoom&&svg.transition().duration(300).call(zoom.scaleBy,1.6);
$('zout').onclick=()=>zoom&&svg.transition().duration(300).call(zoom.scaleBy,1/1.6);
$('zreset').onclick=()=>{if(!zoom)return;if(ui.proj==='globe')proj.rotate([74,-25]);setupZoom();drawGeo();paint();};


/* ---------------- startup ---------------- */
(function init(){
  const h=location.hash.slice(1),params=new URLSearchParams(h.replace(/^#/,''));
  if(params.get('l')==='es'||params.get('l')==='en')LANG=params.get('l');
  if(store.get('take',null))$('resumeTake').hidden=false;
  if(params.get('t')){try{loadTake(dec(params.get('t')));applyHomes();recompute();$('vsPanel').hidden=false;setTimeout(()=>toast(L('sharedView')),60);}catch(e){}}
  applyLang();refreshAll();
})();

getWorld().then(fs=>{
  features=fs.filter(f=>f.geometry).map(fixWinding);
  features.forEach(d=>{d._e=entOfFeature(d)||fallbackEnt(d);if(!d._e.hasGeo){const c=d3.geoCentroid(d);setGeo(d._e,c[1],c[0],true);}});
  snapshotAdriano();
  landFC={type:'FeatureCollection',features:features.filter(d=>d.id!=='ATA'&&+d.id!==10)};
  gCountries.selectAll('path').data(features).join('path')
    .on('mousemove',(ev,d)=>{if(ui.showC)showTip(ev,d._e);}).on('mouseleave',hideTip)
    .on('click',(ev,d)=>{if(ui.showC)select(d._e,false);});
  gCities.selectAll('circle').data(cities).join('circle').style('cursor','pointer')
    .on('mousemove',(ev,d)=>showTip(ev,d)).on('mouseleave',hideTip)
    .on('click',(ev,d)=>{ev.stopPropagation();select(d,false);});
  gLabels.selectAll('text').data(cities).join('text').attr('font-family','IBM Plex Sans, system-ui, sans-serif').attr('paint-order','stroke').attr('stroke-linejoin','round');
  selectsUI();rebuild();refreshAll();
}).catch(()=>{$('mapbox').insertAdjacentHTML('beforeend',`<p class="maperr">${LANG==='es'?'No se pudo cargar el contorno del mapa. Los filtros, puntajes, comparaciones y el ranking siguen funcionando.':'The map outlines couldn’t load. Filters, scores, compare and the ranking still work.'}</p>`);});
})();
</script>
</body>
