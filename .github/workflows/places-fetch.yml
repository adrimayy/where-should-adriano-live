name: fetch places
on:
  push:
    branches: [places-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow
      - run: python3 pipeline/import_places.py --sheets build/sheets
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pipeline/input/places.json build/sheets build/places_report.txt build/places_cache.json || true
          git commit -m "fetched places" || true
          git push || true
