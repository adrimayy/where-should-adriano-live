# Monthly check: lists every source whose figures are more than 12 months old (tests/data_age.py). It never fails the run;
# read the report in the run's summary.
name: data age check
on:
  schedule: [{cron: '17 9 1 * *'}]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tests/data_age.py | tee -a "$GITHUB_STEP_SUMMARY"
